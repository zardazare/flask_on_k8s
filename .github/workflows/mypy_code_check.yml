name: Type code checker

on:
  push:
    branches:
      - develop
      - stage
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop
      - stage
      - main

jobs:
  type-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev
      - name: Generate mypy cache
        run: |
          pipenv run mypy app &> /dev/null || echo "Mypy cache created"
      - name: Analyse the code with mypy installed types
        run: |
          yes | pipenv run mypy --install-types
          pipenv run mypy app
