apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    scrape_configs:
      - job_name: "flask_test_app"
        static_configs:
          - targets: ['flask-test-app-service:6000']

# kubectl apply -f prometheus_config.yml
